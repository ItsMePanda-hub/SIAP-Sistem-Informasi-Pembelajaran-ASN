<svg width="760" height="400" viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mockup dashboard SIAP</title>
<desc>Tampilan dashboard SIAP dengan sidebar navigasi teal di kiri dan konten utama berisi sapaan pengguna, dua kartu metrik, dan pratinjau pengumuman terbaru.</desc>
