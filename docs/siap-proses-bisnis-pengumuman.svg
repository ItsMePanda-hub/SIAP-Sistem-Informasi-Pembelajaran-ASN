<svg width="760" height="1000" viewBox="0 0 380 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Proses bisnis pengumuman SIAP</title>
<desc>Atasan membuat pengumuman dan memilih target bidang, pegawai membuka pengumuman sesuai bidangnya, sistem otomatis mencatat tanda terima, lalu atasan memantau status pembacaan.</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="50" y="20" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Atasan buat pengumuman</text>
<text x="190" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Isi judul, isi, kategori</text>
<line x1="190" y1="76" x2="190" y2="120" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow3)"/>
<rect x="50" y="120" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Pilih target bidang</text>
<text x="190" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Bidang sendiri atau broadcast</text>
<line x1="190" y1="176" x2="190" y2="220" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow3)"/>
<rect x="50" y="220" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Pegawai buka pengumuman</text>
<text x="190" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Sesuai bidang yang dituju</text>
<line x1="190" y1="276" x2="190" y2="320" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow3)"/>
<rect x="50" y="320" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="190" y="338" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Tercatat otomatis</text>
<text x="190" y="356" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">Tanda terima elektronik</text>
<line x1="190" y1="376" x2="190" y2="420" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow3)"/>
<rect x="50" y="420" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="438" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Atasan pantau status baca</text>
<text x="190" y="456" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Lihat siapa sudah/belum baca</text>
