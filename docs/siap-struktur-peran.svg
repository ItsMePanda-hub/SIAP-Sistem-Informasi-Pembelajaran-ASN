<svg width="760" height="800" viewBox="0 0 380 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Struktur peran SIAP</title>
<desc>Empat tingkat peran dari atas ke bawah: Admin mengelola seluruh sistem, Pemilik memimpin lintas bidang, Atasan mengelola bidangnya sendiri, Pengguna mengakses sesuai bidangnya.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="50" y="20" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Admin</text>
<text x="190" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Kelola seluruh sistem</text>
<line x1="190" y1="76" x2="190" y2="120" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="50" y="120" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Pemilik</text>
<text x="190" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Pimpinan tertinggi, lintas bidang</text>
<line x1="190" y1="176" x2="190" y2="220" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="50" y="220" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Atasan</text>
<text x="190" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Kepala bidang, bidang sendiri</text>
<line x1="190" y1="276" x2="190" y2="320" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="50" y="320" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="190" y="338" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Pengguna</text>
<text x="190" y="356" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Akses sesuai bidangnya</text>
</svg>
